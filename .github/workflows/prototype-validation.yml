name: Validate prototype

on:
  push:
    branches:
      - codex/prototype-*
  pull_request:
    branches: [main]
  workflow_call:

# Ongoing checks have read-only access and cannot create tags, releases or uploads.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Read the exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api "repos/$GH_REPO/tarball/$GITHUB_SHA" > "$RUNNER_TEMP/prototype.tar.gz"
          tar -xzf "$RUNNER_TEMP/prototype.tar.gz" --strip-components=1
      - name: Install locked development checks
        run: npm ci --ignore-scripts
      - name: Check source, style, frozen extension, bookmark and release inputs
        run: npm run check
      - name: Run behavioural and release tests
        run: npm test
