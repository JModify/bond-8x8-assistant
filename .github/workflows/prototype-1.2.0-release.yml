name: Publish prototype v1.2.0

on:
  push:
    branches: [main]
    paths:
      - releases/edge-prototype/1.2.0/Service-Desk-8x8-Assistant.js

# One-off publication of this release only. No manual trigger or future-version automation.
permissions:
  contents: write

concurrency:
  group: prototype-1.2.0-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Read the exact release commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api "repos/$GH_REPO/tarball/$GITHUB_SHA" > "$RUNNER_TEMP/prototype.tar.gz"
          tar -xzf "$RUNNER_TEMP/prototype.tar.gz" --strip-components=1
      - name: Publish verified prototype and download
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROTOTYPE_RELEASE_VERSION: '1.2.0'
        run: node tools/publish-prototype-release.cjs
