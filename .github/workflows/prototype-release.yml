name: Validate and release prototype

on:
  push:
    branches:
      - main
      - codex/prototype-*
  pull_request:
    branches: [main]

# Validation is read-only. Only the separately gated publishing job can create a release.
permissions:
  contents: read

concurrency:
  group: prototype-${{ github.sha }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Read the exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api "repos/$GH_REPO/tarball/$GITHUB_SHA" > "$RUNNER_TEMP/prototype.tar.gz"
          tar -xzf "$RUNNER_TEMP/prototype.tar.gz" --strip-components=1
      - name: Install locked development checks
        run: npm ci --ignore-scripts
      - name: Check source, style, frozen extension, bookmark and release inputs
        run: npm run check
      - name: Run behavioural and release tests
        run: npm test
      - name: Select a newly added prototype release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ] && [ "$GITHUB_EVENT_NAME" = "push" ]; then
            gh api "repos/$GH_REPO/compare/$BEFORE...$GITHUB_SHA" > "$RUNNER_TEMP/prototype-changes.json"
          else
            printf '{"files":[]}' > "$RUNNER_TEMP/prototype-changes.json"
          fi
          node <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')
          const { prepareRelease, releaseAdded } = require('./tools/publish-prototype-release.cjs')
          const info = prepareRelease(process.cwd(), process.env.GITHUB_REPOSITORY, process.env.GITHUB_SHA)
          const changes = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'prototype-changes.json'), 'utf8'))
          const publish = process.env.GITHUB_REF === 'refs/heads/main' &&
            process.env.GITHUB_EVENT_NAME === 'push' && releaseAdded(info.version, changes.files)
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'publish=' + publish + '\nversion=' + info.version + '\n')
          NODE

  publish:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Read the tested release commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api "repos/$GH_REPO/tarball/$GITHUB_SHA" > "$RUNNER_TEMP/prototype.tar.gz"
          tar -xzf "$RUNNER_TEMP/prototype.tar.gz" --strip-components=1
      - name: Publish both verified prototype downloads
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROTOTYPE_RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          PROTOTYPE_RELEASE_APPROVED: added-snapshot
        run: node tools/publish-prototype-release.cjs
