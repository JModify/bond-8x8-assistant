name: Publish prototype v1.2.3

on:
  push:
    branches: [main]
    paths:
      - releases/edge-prototype/1.2.3/Service-Desk-8x8-Assistant.js

# One-off publication for this requested version. No manual or future-version trigger.
permissions:
  contents: read

concurrency:
  group: prototype-1.2.3-release
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/prototype-validation.yml
    permissions:
      contents: read

  publish:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Read the exact tested release commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api "repos/$GH_REPO/tarball/$GITHUB_SHA" > "$RUNNER_TEMP/prototype.tar.gz"
          tar -xzf "$RUNNER_TEMP/prototype.tar.gz" --strip-components=1
      - name: Publish both verified v1.2.3 downloads
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROTOTYPE_RELEASE_VERSION: '1.2.3'
          PROTOTYPE_RELEASE_APPROVED: v1.2.3-snapshot
        run: node tools/publish-prototype-release.cjs
